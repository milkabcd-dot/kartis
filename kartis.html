<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>כרטיסי גירוד - אברוני התא</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { text-align: center; margin-bottom: 20px; color: var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; }

        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; border-top: 5px solid var(--primary); }
        .description { font-size: 0.95em; line-height: 1.5; color: #333; margin-bottom: 20px; min-height: 80px; }

        /* הגדרות קנבס הגירוד */
        .scratch-container { position: relative; width: 200px; height: 60px; background: #fff; border: 2px dashed #ccc; border-radius: 10px; overflow: hidden; }
        .secret-name { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2em; color: var(--primary); z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; z-index: 2; cursor: crosshair; touch-action: none; }

        .footer { margin-top: 30px; font-weight: bold; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="header">
    <h1>משימת גירוד: אברוני התא</h1>
    <p>קראו את התיאור וגרדו את המלבן כדי לגלות את שם האברון!</p>
</div>

<div class="grid" id="gameGrid"></div>

<div class="footer">עריכה: מילכה ברקו גרש</div>

<script>
    const data = [
        { desc: "מהווה חלק גדול מנפח תא הצמח הבוגר, משמשת כמאגר נוזלים ומומסים, מאפשרת את יציבות התא.", name: "חלולית" },
        { desc: "אחראי לתפקודו התקין של התא, ולהעברת מידע תורשתי.", name: "גרעין התא" },
        { desc: "הנוזל התוך-תאי ובו מומסים שונים, ומבנים ואברונים שונים. מקום התרחשות של תהליכים חיוניים.", name: "ציטופלזמה" },
        { desc: "תוחם את תכולת התא, ומאפשר רק לחלק מהחומרים לעבור דרכו פנימה והחוצה.", name: "קרום התא" },
        { desc: "מדור, או גופיף, או שקיק תוך-תאי, המתחם בממברנה משלו והוא בעל תפקיד ייחודי בתא.", name: "אברון" },
        { desc: "אחראי על תהליך הנשימה והפקת האנרגיה בתא.", name: "מיטוכונדריה" },
        { desc: "מצוי ברקמות הירוקות בצמחים ואצות, קולט את האור הדרוש לתהליך הפוטוסינתזה.", name: "כלורופלסט" },
        { desc: "קיים בתאי הצמחים, מספק לתאים תמיכה ומבנה קשיח. מקנה להם את צורתם.", name: "דופן התא" }
    ];

    function createCard(item) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="description">${item.desc}</div>
            <div class="scratch-container">
                <div class="secret-name">${item.name}</div>
                <canvas width="200" height="60"></canvas>
            </div>
        `;
        return card;
    }

    const grid = document.getElementById('gameGrid');
    data.forEach(item => {
        const card = createCard(item);
        grid.appendChild(card);
        setupScratch(card.querySelector('canvas'));
    });

    function setupScratch(canvas) {
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // ציור שכבת הכיסוי (אפור "מגרד")
        ctx.fillStyle = '#C0C0C0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // הוספת טקסט "גרדו כאן"
        ctx.fillStyle = '#666';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('גרדו כאן', canvas.width/2, canvas.height/2 + 5);

        function scratch(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('touchstart', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        window.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchmove', scratch);
    }
</script>

</body>
</html>
