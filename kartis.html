<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>כרטיסי גירוד - אברוני התא</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f4f7f9; }
        
        /* חסימת תנועות מסך מיותרות ושיפור מגע */
        html, body { 
            scrollbar-width: none; 
            -ms-overflow-style: none;
            overflow-x: hidden;
            overscroll-behavior: none; /* מונע רענון במשיכה למטה */
        }
        body::-webkit-scrollbar { display: none; }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        
        .header { text-align: center; margin-bottom: 15px; color: var(--primary); width: 90%; }
        .header h1 { font-size: 1.5em; margin: 5px 0; }
        .header p { font-size: 0.9em; color: #555; margin: 2px 0; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; width: 100%; max-width: 1200px; padding-bottom: 20px; }

        .card { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; text-align: center; border-top: 5px solid var(--primary); }
        .description { font-size: 0.95em; line-height: 1.4; color: #333; margin-bottom: 15px; min-height: 80px; display: flex; align-items: center; justify-content: center; }

        .scratch-container { position: relative; width: 220px; height: 65px; background: #fff; border: 2px dashed #ccc; border-radius: 10px; overflow: hidden; }
        .secret-name { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.3em; color: var(--primary); z-index: 1; pointer-events: none; }
        
        canvas { position: absolute; top: 0; left: 0; z-index: 2; cursor: crosshair; touch-action: none; }

        .footer { width: 100%; background: var(--primary); color: white; text-align: center; padding: 10px 0; font-weight: bold; font-size: 0.85em; }
    </style>
</head>
<body>

<div class="header">
    <h1>אברוני התא ותפקידם</h1>
    <p>גרדו היטב את המלבן האפור כדי לחשוף את התשובה!</p>
</div>

<div class="grid" id="gameGrid"></div>

<div class="footer">
    © מילכה ברקו גרש | אתר: שלושה פרפרי זהב
</div>

<script>
    const data = [
        { desc: "מהווה חלק גדול מנפח תא הצמח הבוגר, משמשת כמאגר נוזלים ומומסים, מאפשרת את יציבות התא.", name: "חלולית", color: "#d1e8ff" },
        { desc: "אחראי לתפקודו התקין של התא, ולהעברת מידע תורשתי.", name: "גרעין התא", color: "#f9e1e1" },
        { desc: "הנוזל התוך-תאי ובו מומסים שונים, ומבנים ואברונים שונים. מקום התרחשות של תהליכים חיוניים.", name: "ציטופלזמה", color: "#fce8d1" },
        { desc: "תוחם את תכולת התא, ומאפשר רק לחלק מהחומרים לעבור דרכו פנימה והחוצה.", name: "קרום התא", color: "#e1e1e1" },
        { desc: "מדור, או גופיף, או שקיק תוך-תאי, המתחם בממברנה משלו והוא בעל תפקיד ייחודי בתא.", name: "אברון", color: "#ffffff" },
        { desc: "אחראי על תהליך הנשימה והפקת האנרגיה בתא.", name: "מיטוכונדריה", color: "#e7e1f9" },
        { desc: "מצוי ברקמות הירוקות בצמחים ואצות, קולט את האור הדרוש לתהליך הפוטוסינתזה.", name: "כלורופלסט", color: "#e1f9e1" },
        { desc: "קיים בתאי הצמחים, מספק לתאים תמיכה ומבנה קשיח. מקנה להם את צורתם.", name: "דופן התא", color: "#d9ccc5" }
    ];

    const grid = document.getElementById('gameGrid');
    data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.backgroundColor = item.color;
        card.innerHTML = `
            <div class="description">${item.desc}</div>
            <div class="scratch-container">
                <div class="secret-name">${item.name}</div>
                <canvas width="220" height="65"></canvas>
            </div>
        `;
        grid.appendChild(card);
        setupScratch(card.querySelector('canvas'));
    });

    function setupScratch(canvas) {
        const ctx = canvas.getContext('2d', { alpha: false }); // שיפור ביצועים
        let isDrawing = false;

        ctx.fillStyle = '#b0b0b0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#444';
        ctx.font = 'bold 16px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('גרדו כאן לגלות', canvas.width/2, canvas.height/2 + 7);

        function handleStart(e) {
            isDrawing = true;
            handleMove(e);
        }

        function handleMove(e) {
            if (!isDrawing) return;
            e.preventDefault(); // מניעת גלילה של כל הדף

            const rect = canvas.getBoundingClientRect();
            const pos = e.touches ? e.touches[0] : e;
            const x = pos.clientX - rect.left;
            const y = pos.clientY - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2); // מברשת קצת יותר גדולה
            ctx.fill();
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('touchstart', handleStart, { passive: false });
        
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, { passive: false });

        window.addEventListener('mouseup', () => isDrawing = false);
        window.addEventListener('touchend', () => isDrawing = false);
    }
</script>

</body>
</html>
